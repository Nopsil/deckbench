# CI installs ruff==0.17.4 and runs `ruff check .`.
# The default rule set is kept. Findings that already exist are ignored per
# file below, so the current tree is not rewritten. A file that is not listed
# is checked in full. A code that is not listed for a file still fails.
# Do not add a global lint.ignore for this.
#
# Some entries include RUF100 because ignoring the rule a `# noqa` was
# silencing makes that directive unused. The sources are left unchanged.

