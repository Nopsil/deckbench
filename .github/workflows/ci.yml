# DeckBench CI.
# Ubuntu and Windows, Python 3.11 and 3.12.
# fastapi, httpx, and python-multipart are installed so the GUI tests run.
# A local game install is not set up, so those tests stay skipped.
# Coverage stays in the job summary (pytest-cov). Lint is ruff, via ruff.toml.
# GUI browser smoke is a separate Ubuntu job (pytest-playwright, Chromium).
# It is not part of the pytest matrix. Without Playwright or Chromium those tests skip.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.17.4
      - name: Ruff
        run: ruff check .

  test:
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt fastapi httpx python-multipart pytest-cov
      - name: Pytest
        run: python -m pytest tests --cov=sts2sim --cov=gui --cov=tools --cov-report=term-missing --cov-report=json:coverage.json
      - name: Coverage summary
        if: always()
        run: python .github/scripts/coverage_summary.py coverage.json

  gui-browser:
    name: playwright (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      DECKBENCH_BROWSER_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-gui.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: gui/web/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-gui.txt pytest-playwright==0.7.2
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Build the web GUI
        working-directory: gui/web
        run: npm ci && npm run build
      - name: Browser smoke
        run: python -m pytest -q tests/test_gui_browser.py --browser chromium --screenshot only-on-failure --tracing retain-on-failure
      - name: Upload screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gui-browser-smoke
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
