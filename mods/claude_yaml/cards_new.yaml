# 手写 Python 版没实现的牌，按设计文档 v3.5 的文字直接写成 YAML（--variant new_cards 打开）。
- id: SLACKING
  name: 摸鱼被抓
  type: Skill
  rarity: Uncommon
  cost: 0
  target: enemy
  keywords:
  - exhaust
  vars:
    FK: 2
  upgrade:
    vars:
      FK: 3
    add:
    - retain
  effects:
  - op: apply
    power: FK
    amount: FK
    target: target
  - op: pick_from_pile
    pile: discard
    n: 1
  note: 近似：从弃牌堆自动挑“最好”的一张（没有排除同名牌）
- id: JOINT_LIABILITY
  name: 连带责任
  type: Skill
  rarity: Uncommon
  cost: 1
  target: enemy
  keywords:
  - exhaust
  vars:
    Solo: 4
  upgrade:
    cost: 0
  effects:
  - op: set
    name: x
    value: fk(T)
  - op: if
    cond: n_enemies() <= 1
    then:
    - op: apply
      power: FK
      amount: Solo
      target: target
    else:
    - op: foreach
      target: others
      do:
      - op: apply
        power: FK
        amount: x
        target: target
        if: x > 0
- id: PASS_THE_BUCK
  name: 甩锅
  type: Skill
  rarity: Uncommon
  cost: 0
  target: enemy
  vars:
    Extra: 2
  upgrade:
    vars:
      Extra: 3
  effects:
  - op: if
    cond: len(others()) == 0
    then:
    - op: apply
      power: FK
      amount: Extra
      target: target
    else:
    - op: set
      name: x
      value: fk(T)
    - op: set_stacks
      power: FK
      value: 0
    - op: foreach
      target: random_other
      do:
      - op: set_stacks
        power: FK
        value: fk(T) + x
      - op: apply
        power: FK
        amount: Extra
        target: target
- id: FK_COLLECTIVE
  name: 风控连坐制
  type: Power
  rarity: Uncommon
  cost: 2
  target: self
  vars:
    FK: 3
  upgrade:
    cost: 1
  effects:
  - op: apply
    power: FK
    amount: FK
    target: all
  - op: apply
    power: FK_COLLECTIVE
    amount: 1
    target: self
- id: ASCII_SHIELD
  name: 画个ASCII盾牌
