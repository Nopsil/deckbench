# 下面这些能力只被 cards_new.yaml 里的新牌用到（变体 new_cards）。
- id: FK_COLLECTIVE
  name: 风控连坐制
  type: buff
  stack: single
  triggers:
  - template: on_enemy_died
    do:
    - op: set
      name: x
      value: fk(T)
    - op: foreach
      target: all
      do:
      - op: apply
        power: FK
        amount: x
        target: target
        if: x > 0
- id: CODE_START
  name: Claude Code，启动！
  type: buff
  triggers:
  - template: at_turn_start
    do:
    - op: add_card
      card: CODE_BLOCK
      n: amount
      to: hand
- id: AUTOMATION
  name: 流程自动化（本回合）
  type: buff
  stack: single
  expire: turn_end
  triggers:
  - template: on_power_applied
    power: FK
    active_only: true
    do:
    - op: draw
      n: 1
- id: ONE_FOR_ALL
  name: 一人违规全员连坐
  type: buff
  triggers:
  - template: on_power_applied
    power: FK
    if: not multi
    do:
    - op: foreach
      target: others
      do:
      - op: apply
        power: FK
        amount: amount
        target: target
        secondary: true
  - template: boost_apply
    power: FK
    add: amount
    if: n_enemies() == 1
    once: turn
- id: GOLDEN_GATE
  name: 金门大桥
  type: buff
  stack: single
  triggers:
  - template: replay_first
    card_type: Attack
